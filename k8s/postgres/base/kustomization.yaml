apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml
  - secret.yaml

configMapGenerator:
  - name: postgres-initdb
    files:
      - init.sql=init.sql
  - name: postgresql-config
    files:
      - postgresql.conf=postgresql.conf
      - pg_hba.conf=pg_hba.conf

generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  app: postgres
  includeSelectors: true
